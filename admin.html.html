<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>Paalcon Admin | செய்திகளைப் பதிவிட</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { font-family: 'Mukta Malar', sans-serif; background: #e9ecef; padding: 20px; }
        .admin-box { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        h2 { color: #e31e24; text-align: center; border-bottom: 2px solid #002d62; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #002d62; color: white; border: none; padding: 15px; margin-top: 25px; width: 100%; border-radius: 5px; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e31e24; }
        .status { text-align: center; margin-top: 10px; color: green; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>PAALCON செய்தி நிர்வாகி</h2>
    <form id="adminForm">
        <label>செய்தித் தலைப்பு (Headline):</label>
        <input type="text" id="title" placeholder="தலைப்பை இங்கே டைப் செய்யவும்" required>

        <label>பிரிவு (Category):</label>
        <select id="category">
            <option value="தமிழகம்">தமிழகம்</option>
            <option value="இந்தியா">இந்தியா</option>
            <option value="தொழில்நுட்பம்">தொழில்நுட்பம்</option>
            <option value="வேலைவாய்ப்பு">வேலைவாய்ப்பு</option>
        </select>

        <label>படத்தின் லிங்க் (Image URL):</label>
        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg" required>

        <label>செய்தி விவரம்:</label>
        <textarea id="content" rows="8" placeholder="செய்தியை விரிவாக எழுதவும்..." required></textarea>

        <button type="submit">செய்தியை வெளியிடு (Publish)</button>
        <p id="statusMsg" class="status">செய்தி வெற்றிகரமாகப் பதிவேற்றப்பட்டது!</p>
    </form>
</div>

<script>
    // உங்கள் Firebase Config-ஐ இங்கே மாற்றவும்
    const firebaseConfig = {
        // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyChk7hxXvWgr_MplHUqxT4QrPTlwltyuVY",
  authDomain: "paalcon-news.firebaseapp.com",
  databaseURL: "https://paalcon-news-default-rtdb.firebaseio.com",
  projectId: "paalcon-news",
  storageBucket: "paalcon-news.firebasestorage.app",
  messagingSenderId: "511182660256",
  appId: "1:511182660256:web:a72ec493e948d9ce381fc5",
  measurementId: "G-6546404Y3B"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
   
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    document.getElementById('adminForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const title = document.getElementById('title').value;
        const category = document.getElementById('category').value;
        const imageUrl = document.getElementById('imageUrl').value;
        const content = document.getElementById('content').value;
        const timestamp = new Date().toLocaleString('ta-IN');

        // Firebase-க்கு தரவுகளை அனுப்புதல்
        database.ref('news').push({
            title: title,
            category: category,
            image: imageUrl,
            content: content,
            date: timestamp
        }).then(() => {
            document.getElementById('statusMsg').style.display = 'block';
            document.getElementById('adminForm').reset();
            setTimeout(() => { document.getElementById('statusMsg').style.display = 'none'; }, 3000);
        }).catch((error) => {
            alert("பிழை ஏற்பட்டது: " + error.message);
        });
    });
</script>

</body>
</html>
