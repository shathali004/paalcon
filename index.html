<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paalcon News | தமிழ் செய்திகள்</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Arima:wght@700&family=Mukta+Malar:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paalcon-red: #e31e24;
            --paalcon-blue: #002d62;
            --bg-body: #f0f2f5;
        }

        body {
            margin: 0;
            font-family: 'Mukta Malar', sans-serif;
            background-color: var(--bg-body);
            color: #333;
        }

        .top-bar { background: #000; color: #fff; padding: 10px; display: flex; font-size: 0.9rem; }
        .breaking-tag { background: var(--paalcon-red); padding: 2px 10px; font-weight: bold; margin-right: 10px; }

        header {
            background: white;
            padding: 25px 0;
            text-align: center;
            border-bottom: 5px solid var(--paalcon-blue);
        }
        .logo { font-size: 4rem; color: var(--paalcon-red); font-family: 'Arima', cursive; margin: 0; text-decoration: none; }

        nav {
            background: var(--paalcon-blue);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding: 5px 0;
        }
        nav a { color: white; text-decoration: none; padding: 12px 20px; font-weight: bold; white-space: nowrap; }
        nav a:hover { background: rgba(255,255,255,0.1); color: #ffd700; }

        .wrapper {
            max-width: 1200px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            padding: 0 15px;
        }

        .post {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .post img { width: 100%; height: auto; max-height: 400px; object-fit: cover; display: block; }
        .post-info { padding: 20px; }
        .post-title { font-size: 1.8rem; color: var(--paalcon-blue); line-height: 1.3; margin: 10px 0; }

        .whatsapp-join {
            background: #25D366; color: white; text-align: center; padding: 12px;
            display: block; text-decoration: none; font-weight: bold; border-radius: 5px; margin-top: 15px;
        }

        .sidebar .widget {
            background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-top: 4px solid var(--paalcon-red);
        }
        .widget h3 { margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }

        @media (max-width: 768px) {
            .wrapper { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <span class="breaking-tag">முக்கிய செய்தி</span>
    <marquee>Paalcon News: இன்றைய தலைப்புச் செய்திகள் உடனுக்குடன் இங்கே!</marquee>
</div>

<header>
    <a href="#" class="logo">PAALCON</a>
    <p style="font-weight: bold;">உண்மை, நடுநிலை, துரிதம்</p>
</header>

<nav>
    <a href="#">முகப்பு</a>
    <a href="#">தமிழகம்</a>
    <a href="#">இந்தியா</a>
    <a href="#">கல்வி</a>
    <a href="#">வேலைவாய்ப்பு</a>
</nav>

<div class="wrapper">
    <!-- செய்திகள் இங்கே வந்து சேரும் -->
    <main class="main-content" id="news-container">
        <p style="text-align: center; padding: 50px;">செய்திகள் ஏற்றப்படுகின்றன...</p>
    </main>

    <aside class="sidebar">
        <div class="widget">
            <h3>பிரபலமானவை</h3>
            <ul style="list-style: none; padding: 0;">
                <li style="padding: 8px 0; border-bottom: 1px solid #eee;">தமிழக வேலைவாய்ப்பு செய்திகள்</li>
                <li style="padding: 8px 0; border-bottom: 1px solid #eee;">தங்கம் விலை நிலவரம்</li>
            </ul>
        </div>
    </aside>
</div>

<!-- Firebase Scripts - இவைதான் முக்கியம் -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyChk7hxXvWgr_MplHUqxT4QrPTlwltyuVY",
    authDomain: "paalcon-news.firebaseapp.com",
    databaseURL: "https://paalcon-news-default-rtdb.firebaseio.com",
    projectId: "paalcon-news",
    storageBucket: "paalcon-news.firebasestorage.app",
    messagingSenderId: "511182660256",
    appId: "1:511182660256:web:a72ec493e948d9ce381fc5"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  // செய்திகளைத் திரையில் காட்டுதல்
  database.ref('news').on('value', (snapshot) => {
      const newsContainer = document.getElementById('news-container');
      newsContainer.innerHTML = ""; 
      
      if(!snapshot.exists()) {
          newsContainer.innerHTML = "<p style='text-align:center;'>செய்திகள் ஏதும் இல்லை.</p>";
          return;
      }

      snapshot.forEach((child) => {
          const val = child.val();
          newsContainer.innerHTML = `
              <div class="post">
                  <img src="${val.image}" onerror="this.src='https://via.placeholder.com/800x400?text=No+Image'">
                  <div class="post-info">
                      <h2 class="post-title">${val.title}</h2>
                      <p style="color: gray; font-size: 0.8rem;">${val.date || ''}</p>
                      <p>${val.content}</p>
                      <a href="#" class="whatsapp-join"><i class="fab fa-whatsapp"></i> வாட்ஸ்அப் குழுவில் இணைய</a>
                  </div>
              </div>` + newsContainer.innerHTML; // புதிய செய்தி மேலே வர
      });
  });
</script>

</body>
</html>
